research_topic: "EUのプライバシー対応の現状と、日本の各企業が実施している主要な対応"
max_num_nodes: 10
checkpoint_path: null
top_k: 5
include_revise: true

llm:
  base_url: "http://127.0.0.1:1067"
  model: "unsloth/Qwen3.6-27B-MTP-GGUF-UD-Q4_K_XL"
  enable_thinking: false
  temperature: 0.7
  max_tokens: 30000

search:
  url: "http://127.0.0.1:4866"
  engines: "google,bing,brave,yandex"
  language: null
  max_results: 5
  max_queries: 3
  # クエリワードの最大数
  max_query_words: 10

exploration:
  planner_temperature: 0.7
  num_facets: 4
  novelty_penalty_weight: 0.15
  coverage_bonus: 0.05
  # deepen/criticize/revise で親コンテキストが欠けている場合の減点
  action_target_penalty_weight: 0.20
  # 語ベースJaccardの近似重複しきい値。生成時フィルタと重複ペナルティの両方で使用。
  query_similarity_threshold: 0.6

algo:
  class_name: "ABMCTSM"
  batch_size: 5
  params:
    model_selection_strategy: "stack"

hydra:
  run:
    dir: outputs/deepresearch/${algo.class_name}_${now:%Y-%m-%d_%H-%M-%S}
